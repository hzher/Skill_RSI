[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-rsi"
version = "0.5.1"
description = "CLI for evidence-based memory strategies and harness extensions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE*", "skill_rsi/**/LICENSE*"]
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6"]

[project.scripts]
skill-rsi = "skill_rsi.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["skill_rsi*"]
namespaces = false
