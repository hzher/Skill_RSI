[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillrl-framework"
version = "0.1.0"
description = "Task execution, versioned skill management and evidence-based review with replaceable benchmarks"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
skillrl = "skillrl.cli:main"

[tool.setuptools.packages.find]
include = ["skillrl*"]
